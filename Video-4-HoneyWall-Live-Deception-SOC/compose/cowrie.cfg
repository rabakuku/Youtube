# filepath: https://github.com/rabakuku/Youtube/blob/main/Video-4-HoneyWall-Live-Deception-SOC/compose/cowrie.cfg
# HoneyWall overlay for Cowrie 3.1.5.
# Cowrie loads its bundled cowrie.cfg.dist first, then this file on top
# (last wins per key), so only the settings HoneyWall changes are listed here.
# Environment variables COWRIE_<SECTION>_<KEY> override both (compose sets the hostname).

[honeypot]
# Shell prompt / hostname the attacker sees
hostname = srv-corp-ssh01
log_path = var/log/cowrie
state_path = var/lib/cowrie
etc_path = etc
# TTY logs power the HoneyWall session replay
ttylog = true
ttylog_path = ${honeypot:state_path}/tty
download_path = ${honeypot:state_path}/downloads
authentication_timeout = 120
timezone = UTC
# UserDB = only the credentials in etc/userdb.txt can log in
auth_class = UserDB

[shell]
# Built by the cowrie-fsbuild one-shot container (build_honeyfs.py):
# bundled filesystem + HoneyWall honeytokens + the svc_backup user
filesystem = /cowrie/cowrie-git/var/lib/cowrie/honeywall-fs.pickle
kernel_version = 6.1.0-28-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.119-1 (2024-11-22)
hardware_platform = x86_64
operating_system = GNU/Linux

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
# What nmap -sV reports for the decoy
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
sftp_enabled = true
forwarding = false

[telnet]
enabled = false

[output_jsonlog]
# The HoneyWall engine tails this file (daily rotation is handled by the engine)
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
