# filepath: https://github.com/rabakuku/Youtube/blob/main/Video-4-HoneyWall-Live-Deception-SOC/compose/ntfy/server.yml
# ntfy server config for HoneyWall alerts.
# base-url is injected from .env (NTFY_BASE_URL) via the compose environment.
listen-http: ":80"
cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "72h"
behind-proxy: false
enable-login: false
web-root: "/"
log-level: "info"
# Never rate-limit the HoneyWall engine (Docker network)
visitor-request-limit-exempt-hosts: "172.28.10.0/24"
