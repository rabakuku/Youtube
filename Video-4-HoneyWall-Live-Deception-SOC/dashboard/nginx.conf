# filepath: https://github.com/rabakuku/Youtube/blob/main/Video-4-HoneyWall-Live-Deception-SOC/dashboard/nginx.conf
# HoneyWall dashboard: static files + reverse proxy to the engine (Docker service "engine")
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # container healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # live event stream (Server-Sent Events) - never buffer
    location = /api/stream {
        proxy_pass http://engine:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://engine:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
