# filepath: https://github.com/rabakuku/Youtube/blob/main/Video-3-Visual-SOC-Analytics-Traffic-Dashboard/compose/docker-compose.yml
# -----------------------------------------------------------------------------
# Zero-Cost Visual SOC — Vector → Loki → Grafana on Alpine 3.24 (192.168.10.2)
# Expected host layout (setup.sh in Stage 3 builds it):
#   compose/docker-compose.yml
#   compose/.env
#   compose/vector/vector.yaml
#   compose/loki/local-config.yaml
#   compose/grafana/provisioning/datasources/grafana-datasource.yaml
#   compose/grafana/provisioning/dashboards/grafana-dashboards.yaml
#   compose/grafana/dashboards/soc-wallboard.json
# -----------------------------------------------------------------------------
name: visual-soc

services:
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:2.9.4}
    container_name: soc-loki
    restart: unless-stopped
    env_file: .env
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -config.expand-env=true
    ports:
      # Debug access from the Alpine host only — never exposed to VLAN 40
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - soc_net

  vector:
    image: ${VECTOR_IMAGE:-timberio/vector:0.36.0-alpine}
    container_name: soc-vector
    restart: unless-stopped
    env_file: .env
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      - VECTOR_LOG=${VECTOR_LOG:-info}
    ports:
      - "514:514/udp" # FortiGate syslog ingestion (FGT 192.168.10.1 → 192.168.10.2:514)
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector_data:/var/lib/vector
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8686/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - soc_net

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:10.3.3}
    container_name: soc-grafana
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:3000" # Web GUI on host port 80 (Kali → http://192.168.10.2)
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in compose/.env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_VIEWER:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/soc-wallboard.json
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - soc_net

volumes:
  vector_data:
  loki_data:
  grafana_data:

networks:
  soc_net:
    name: soc_net
    driver: bridge
