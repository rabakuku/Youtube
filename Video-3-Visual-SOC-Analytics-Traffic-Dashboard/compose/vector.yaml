# filepath: https://github.com/rabakuku/Youtube/blob/main/Video-3-Visual-SOC-Analytics-Traffic-Dashboard/compose/vector.yaml
# -----------------------------------------------------------------------------
# Vector 0.36 — FortiOS 7.4 syslog (default key=value format) → Loki
# Host path: compose/vector/vector.yaml
# -----------------------------------------------------------------------------
data_dir: /var/lib/vector

api:
  enabled: true
  address: 0.0.0.0:8686   # used only by the container healthcheck (not published)

sources:
  fortigate_syslog:
    type: socket
    mode: udp
    address: 0.0.0.0:514

transforms:
  fortigate_parser:
    type: remap
    inputs:
      - fortigate_syslog
    drop_on_abort: true
    source: |
      sender = to_string(.host) ?? "unknown"
      raw = string!(.message)

      # Strip the syslog priority prefix, e.g. "<189>date=2026-11-03 ..."
      raw = replace(raw, r'^<\d+>', "")

      kv, err = parse_key_value(raw, key_value_delimiter: "=", field_delimiter: " ")
      # A real FortiOS log always carries type= and logid= (drops stray/garbage packets)
      if err != null || !exists(kv.type) || !exists(kv.logid) {
        log("Unparseable syslog line from " + sender + ": " + raw, level: "debug", rate_limit_secs: 30)
        abort
      }

      . = kv
      .fgt_sender = sender
      .timestamp = now()

      # Guarantee the fields used as Loki labels always exist
      # (event logs such as admin logins have no action=)
      if !exists(.action) { .action = "none" }

      # Normalised verdict used by every dashboard panel:
      #   blocked  = firewall deny, IPS drop/reset, or UTM block
      #   detected = UTM/IPS event that was logged but let through
      #   allowed  = everything else
      blocked_actions = ["deny", "dropped", "blocked", "block", "reset", "reset-client", "reset-server", "clear_session"]
      if includes(blocked_actions, .action) || .utmaction == "block" {
        .verdict = "blocked"
      } else if .type == "utm" {
        .verdict = "detected"
      } else {
        .verdict = "allowed"
      }

sinks:
  loki:
    type: loki
    inputs:
      - fortigate_parser
    endpoint: http://soc-loki:3100
    encoding:
      codec: json
    # Low-cardinality labels only — IPs/ports stay in the JSON body
    labels:
      source: fortigate
      log_type: "{{ type }}"
      action: "{{ action }}"
      verdict: "{{ verdict }}"
    out_of_order_action: accept
    buffer:
      type: disk
      max_size: 268435488     # ~256 MiB (Vector's minimum disk buffer) — survives Loki restarts
      when_full: block
