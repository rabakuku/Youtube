# filepath: https://github.com/rabakuku/Youtube/blob/main/Video-3-Visual-SOC-Analytics-Traffic-Dashboard/compose/grafana-datasource.yaml
# -----------------------------------------------------------------------------
# Grafana 10.3 datasource provisioning — Loki over the internal soc_net bridge
# Host path: compose/grafana/provisioning/datasources/grafana-datasource.yaml
# (replaces the old compose/loki.yaml, which pointed at the host IP)
# -----------------------------------------------------------------------------
apiVersion: 1

datasources:
  - name: Loki
    uid: loki-fortigate
    type: loki
    access: proxy
    url: http://soc-loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
